name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gira
          POSTGRES_PASSWORD: gira
          POSTGRES_DB: gira
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gira -d gira" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql://gira:gira@localhost:5432/gira
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gira-whatsapp-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
