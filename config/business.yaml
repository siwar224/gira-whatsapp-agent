# Anything else the agent may tell guests.
facts:
  - "Crea il tuo — build your own plate online: choose a pasta (linguine, spaghetti or paccheri), a sauce (pomodoro, bianco, nero di seppia or pesto), up to three treasures from the sea and extras like burrata. Price and allergens update as you build."
  - Plates built online can be pre-ordered with a booking from the manage-booking page, so the kitchen has them ready.
  - Nothing is paid online — guests pay at the restaurant.
  - Bookings are possible every 30 minutes; the last booking is 60 minutes before closing. Today, only from 30 minutes from now.
  - Every booking gets a code like GIRA-XXXXXXXX, needed at the door and to manage or cancel the booking (no account).
  - When a moment is full, guests can join the waiting list and are emailed when a table frees up.
  - Personal details are deleted automatically after the evening.

# Topics the agent must never bring up or recommend.
never_mention:
  - wine or any alcoholic drink
