menu:
  note: The menu follows the market — a few dishes change every week.
  categories:
    - name: Pasta
      intro: Made every morning, cooked to order.
      items:
        - { name: Spaghetti al pomodoro, price: 14, description: "San Marzano tomato, garlic confit, torn basil, a prawn on top" }
        - { name: Linguine allo scoglio, price: 24, description: "Mussels, prawns, cherry tomatoes and garlic", tags: [Signature] }
        - { name: Paccheri alla Norma, price: 16, description: "Fried aubergine, slow tomato sugo, ricotta salata", tags: [Vegetarian] }
        - { name: Tagliatelle ai frutti di mare, price: 22, description: "Hand-cut ribbons, a white ragù of the day's catch, lemon zest" }
    - name: Mare
      intro: Whatever the boats brought in this morning.
      items:
        - { name: Gamberi all'aglio, price: 18, description: "Prawns seared with garlic, chilli and parsley, bread for the sauce" }
