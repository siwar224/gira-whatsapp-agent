        - { name: Frittura di paranza, price: 19, description: "Small fish of the day, lightly fried, lemon" }
    - name: Antipasti
      intro: To share while the water boils.
      items:
        - { name: Pomodorini e burrata, price: 12, description: "Sweet cherry tomatoes, creamy burrata, basil oil", tags: [Vegetarian] }
        - { name: Bruschetta al pomodoro, price: 8, description: "Grilled bread, raw tomato, garlic, oregano", tags: [Vegan] }
        - { name: Polpo e patate, price: 14, description: "Tender octopus, crushed potatoes, olives and parsley" }
    - name: Dolci
