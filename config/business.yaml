# Everything the agent knows about the restaurant. Edit this file to change the menu, hours,
# tables or house rules — no code change needed. Restart the service to load it.

name: GIRA — Pasta & Mare
description: >
  A small Italian kitchen. Pasta rolled by hand every morning (12 shapes), seafood bought at the
  fish market at 6 a.m., twirled to order. 40 seats, never more.

# One of: TN (Tunisia), MA (Morocco), FR (France), IT (Italy), DE (Germany), ES (Spain).
