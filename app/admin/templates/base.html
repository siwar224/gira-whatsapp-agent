<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}{{ restaurant }}{% endblock %} · WhatsApp host</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23812116'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23f7f1e8' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  {% if user %}
  <header class="topbar">
    <a class="brand" href="/admin">
      <span class="brand-mark" aria-hidden="true">◎</span>
      <span><strong>{{ restaurant }}</strong><small>WhatsApp host</small></span>
    </a>
    <nav aria-label="Main">
      {% set path = request.url.path %}
      <a href="/admin" {% if path == '/admin' %}aria-current="page"{% endif %}>Overview</a>
      <a href="/admin/conversations" {% if path.startswith('/admin/conversations') %}aria-current="page"{% endif %}>Inbox</a>
      <a href="/admin/playground" {% if path == '/admin/playground' %}aria-current="page"{% endif %}>Playground</a>
    </nav>
    <form method="post" action="/admin/logout" class="logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" class="link">Sign out</button>
    </form>
  </header>
  {% endif %}

  <main class="{% block main_class %}page{% endblock %}">
    {% if flash %}
    <p class="flash flash-{{ flash.kind }}" role="status">{{ flash.message }}</p>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">v{{ version }}</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
